name: TestFlight

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: Approve one manual macOS job to compile, sign, and upload (no UI tests)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    if: inputs.confirm_upload && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    environment: app-store
    timeout-minutes: 20
    env:
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '1000' }}
      REQUIRE_DUO: "true"
      USAGE_RUNNER: xcode-27
      USAGE_TIMEOUT_MINUTES: "20"
      ENABLE_NATIVE_PUSH: ${{ vars.ENABLE_NATIVE_PUSH || 'false' }}
      APNS_IMAGES_BACKEND_READY: ${{ vars.APNS_IMAGES_BACKEND_READY || 'false' }}
    steps:
      - name: Start usage timer
        run: echo "USAGE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - name: Choose migration-safe build number
        run: bash .github/scripts/select-build-number.sh
      - name: Test build and signing guards
        run: python3 -m unittest discover -s tools/tests
      - name: Validate distribution profile before compiling
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          NOTIFICATION_SERVICE_PROFILE_BASE64: ${{ secrets.NOTIFICATION_SERVICE_PROFILE_BASE64 }}
        run: bash .github/scripts/check-profile.sh
      - name: Install project generator
        run: brew bundle --file Brewfile
      - name: Test core contracts
        run: swift test
      - name: Configure Duo SDK and generate project
        run: bash .github/scripts/prepare-ios.sh
      - name: Archive, sign, and upload to TestFlight
        env:
          DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          NOTIFICATION_SERVICE_PROFILE_BASE64: ${{ secrets.NOTIFICATION_SERVICE_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash .github/scripts/testflight.sh
      - name: Report run usage
        if: always() && steps.checkout.outcome == 'success'
        env:
          USAGE_RESULT: ${{ job.status }}
        run: bash .github/scripts/report-usage.sh
