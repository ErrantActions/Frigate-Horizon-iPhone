name: FrigateHorizon
options:
  bundleIdPrefix: com.frigatehorizon
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
packages:
  HorizonCore:
    path: .
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 156.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ${DUO_SDK}"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    NATIVE_PUSH_ENABLED: "${NATIVE_PUSH_ENABLED}"
    HORIZON_NOTIFICATION_KEYCHAIN_SUFFIX: "${APP_BUNDLE_ID}.notificationImages"
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  FrigateHorizon:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Horizon.entitlements
          - HorizonPush.entitlements
      - path: Shared
    dependencies:
      - package: HorizonCore
      - package: WebRTC
      - target: HorizonNotificationService
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${APP_BUNDLE_ID}"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: "${APP_ENTITLEMENTS_FILE}"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROFILE_NAME)"
    scheme:
      testTargets:
        - HorizonAppTests
  HorizonNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - Info.plist
          - NotificationService.entitlements
      - path: Shared
    dependencies:
      - package: HorizonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${APP_BUNDLE_ID}.NotificationService"
        INFOPLIST_FILE: NotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(NSE_PROFILE_NAME)"
  HorizonAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HorizonAppTests
      - path: NotificationService/NotificationThumbnailLoader.swift
    dependencies:
      - target: FrigateHorizon
