name: FrigateHorizon
options:
  bundleIdPrefix: com.frigatehorizon
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
packages:
  HorizonCore:
    path: .
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 156.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ${DUO_SDK}"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    NATIVE_PUSH_ENABLED: "${NATIVE_PUSH_ENABLED}"
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  FrigateHorizon:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Horizon.entitlements
    dependencies:
      - package: HorizonCore
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${APP_BUNDLE_ID}"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: "${APP_ENTITLEMENTS_FILE}"
    scheme:
      testTargets:
        - HorizonAppTests
  HorizonAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HorizonAppTests
    dependencies:
      - target: FrigateHorizon
